<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Record Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Student Record Management System</h1>

    <!-- FORM -->
    <form id="studentForm">
      <input type="hidden" id="studentId" />

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter name" required />
      </div>

      <div class="form-group">
        <label for="rollNo">Roll No.</label>
        <input type="text" id="rollNo" placeholder="Enter roll number" required />
      </div>

      <div class="form-group">
        <label for="course">Course</label>
        <input type="text" id="course" placeholder="Enter course" required />
      </div>

      <div class="form-group">
        <label for="marks">Marks (0-100)</label>
        <input type="number" id="marks" placeholder="Enter marks" min="0" max="100" required />
      </div>

      <span id="errorMsg" class="error"></span>

      <button type="submit" id="submitBtn">Add Student</button>
      <button type="button" id="cancelEdit" style="display:none;">Cancel Edit</button>
    </form>

    <!-- TABLE -->
    <table id="studentTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll No.</th>
          <th>Course</th>
          <th>Marks</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <!-- rows injected by JS -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
